<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如果我是一顆麻糬？｜當代生活韌性與形狀心理測驗</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,800;1,400&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0f0e;
            --surface-color: #161c18;
            --text-main: #f0f4f1;
            --text-muted: #829489;
            --accent-green: #39ff14; /* Y2K 螢光綠 */
            --accent-cyan: #00f0ff;  /* Y2K 晶體藍 */
            --accent-silver: #c2cbd5;
            --border-y2k: #2a3b31;
            --window-header: #1e2822;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans TC', 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            position: relative;
        }

        /* Y2K 網格底紋 (確保 pointer-events 為 none 絕不干擾點擊) */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 1;
        }

        header, main, footer {
            position: relative;
            z-index: 10;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-y2k);
            padding: 1rem 1.5rem;
            background: var(--surface-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo-tag {
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .status-badge {
            background-color: #000;
            color: var(--accent-green);
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-family: 'Plus Jakarta Sans', monospace;
            border: 1px solid var(--accent-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        main {
            max-width: 720px;
            width: 100%;
            margin: 3rem auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Y2K 復古金屬視窗 */
        .win95-window {
            background: var(--surface-color);
            border: 2px solid var(--accent-silver);
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.05);
        }

        .win95-titlebar {
            background: var(--window-header);
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-y2k);
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: 0.8rem;
            color: var(--accent-silver);
        }

        .win95-buttons span {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: var(--border-y2k);
            margin-left: 4px;
            border: 1px solid var(--accent-silver);
            text-align: center;
            line-height: 12px;
            font-size: 10px;
            cursor: pointer;
        }

        .win95-body {
            padding: 3rem 2.5rem;
        }

        /* 頁面切換控制 */
        .page {
            display: none;
        }

        .page.active {
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-title {
            font-family: 'Noto Serif TC', serif;
            font-size: clamp(2.5rem, 5vw, 3.8rem);
            font-weight: 400;
            line-height: 1.25;
            margin-bottom: 1.5rem;
            color: #fff;
            letter-spacing: -0.01em;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
