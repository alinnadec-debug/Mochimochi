<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如果我是一顆麻糬？｜當代生活韌性與形狀心理測驗</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,800;1,400&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1210;
            --surface-color: #181d1a;
            --text-main: #f0f4f1;
            --text-muted: #8c9e94;
            --accent-green: #39ff14; /* Y2K 螢光綠 */
            --accent-silver: #c0c8c2;
            --border-y2k: #32443a;
            --window-header: #243029;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans TC', 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Y2K 掃描線與網格特效 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* 背景流動幾何光斑 */
        .bg-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(57, 255, 20, 0.08) 0%, transparent 70%);
            top: 10%;
            left: 10%;
            pointer-events: none;
            z-index: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-y2k);
            padding: 0.75rem 1.25rem;
            background: var(--surface-color);
            position: relative;
            z-index: 10;
        }

        .logo-tag {
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: var(--accent-silver);
            text-transform: uppercase;
        }

        .status-badge {
            background-color: #000;
            color: var(--accent-green);
            padding: 0.2rem 0.6rem;
            font-size: 0.75rem;
            font-family: 'Plus Jakarta Sans', monospace;
            border: 1px solid var(--accent-green);
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.3);
        }

        main {
            max-width: 720px;
            width: 100%;
            margin: 2rem auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        /* 仿 Y2K 視窗容器 */
        .win95-window {
            background: var(--surface-color);
            border: 2px solid var(--accent-silver);
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.8), inset 1px 1px 0px rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
        }

        .win95-titlebar {
            background: var(--window-header);
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-y2k);
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: 0.8rem;
            color: var(--accent-silver);
        }

        .win95-buttons span {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--border-y2k);
            margin-left: 4px;
            border: 1px solid var(--accent-silver);
            text-align: center;
            line-height: 10px;
            font-size: 9px;
            cursor: pointer;
        }

        .win95-body {
            padding: 2.5rem 2rem;
        }

        .page {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .page.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .hero-title {
            font-family: 'Noto Serif TC', serif;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 400;
            line-height: 1.25;
            margin-bottom: 1.25rem;
            letter-spacing: -0.01em;
            color: #fff;
            text-shadow: 0 2px 10px rgba(57, 255, 20, 0.15);
        }

        .hero-subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .slogan-box {
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: 0.85rem;
            color: var(--accent-green);
            background: rgba(57, 255, 20, 0.05);
            border-left: 3px solid var(--accent-green);
            padding: 0.75rem 1rem;
            margin-bottom: 2.5rem;
            letter-spacing: 0.05em;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent-green);
            color: #000;
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: 0.95rem;
            font-weight: 800;
            padding: 1rem 2.5rem;
            border: 2px solid #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            width: fit-content;
            box-shadow: 4px 4px 0px var(--accent-silver);
        }

        .btn:hover {
            background-color: #fff;
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--accent-green);
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--accent-silver);
        }
