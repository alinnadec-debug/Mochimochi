<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如果我是一顆麻糬？｜當代生活韌性與形狀心理測驗</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,800;1,400&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e0c;
            --surface-color: #141916;
            --text-main: #f4f7f5;
            --text-muted: #85968d;
            --accent-green: #39ff14; /* Y2K 螢光綠 */
            --accent-silver: #a3b1a8;
            --border-y2k: #2a3830;
            --window-header: #1e2621;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans TC', 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 乾淨的 Y2K 點陣背景 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(57, 255, 20, 0.08) 1px, transparent 0);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-y2k);
            padding: 1rem 1.5rem;
            background: var(--surface-color);
            position: relative;
            z-index: 10;
        }

        .logo-tag {
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            color: var(--accent-silver);
            text-transform: uppercase;
        }

        .status-badge {
            background-color: #000;
            color: var(--accent-green);
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-family: 'Plus Jakarta Sans', monospace;
            border: 1px solid var(--accent-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        main {
            max-width: 720px;
            width: 100%;
            margin: 2.5rem auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        /* 仿 Y2K 視窗容器 */
        .win95-window {
            background: var(--surface-color);
            border: 2px solid var(--accent-silver);
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.9);
            position: relative;
            z-index: 10;
        }

        .win95-titlebar {
            background: var(--window-header);
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-y2k);
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: 0.8rem;
            color: var(--accent-silver);
        }

        .win95-buttons span {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: var(--border-y2k);
            margin-left: 4px;
            border: 1px solid var(--accent-silver);
            text-align: center;
            line-height: 12px;
            font-size: 10px;
            cursor: pointer;
        }

        .win95-body {
            padding: 3rem 2.5rem;
        }

        .page {
            display: none;
        }

        .page.active {
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

            font-family: 'Noto Serif TC', serif;

            font-weight: 400;
            line-height: 1.25;
